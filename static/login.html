<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — MTG Sideboard Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-indigo-700 flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <!-- Logo + title -->
    <div class="flex flex-col items-center mb-8">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" class="w-14 h-14 drop-shadow-lg mb-3">
        <circle cx="16" cy="16" r="15.5" fill="#1e1b4b"/>
        <g stroke="#1e1b4b" stroke-width="0.7" stroke-linejoin="round">
          <path d="M16 16L16 3A13 13 0 0 1 28.36 11.98Z" fill="#FBF7D5"/>
          <path d="M16 16L28.36 11.98A13 13 0 0 1 23.64 26.52Z" fill="#2C8FD6"/>
          <path d="M16 16L23.64 26.52A13 13 0 0 1 8.36 26.52Z" fill="#322B26"/>
          <path d="M16 16L8.36 26.52A13 13 0 0 1 3.64 11.98Z" fill="#D8313B"/>
          <path d="M16 16L3.64 11.98A13 13 0 0 1 16 3Z" fill="#1FA05F"/>
        </g>
        <circle cx="16" cy="16" r="4.2" fill="#1e1b4b"/>
        <circle cx="16" cy="16" r="2.6" fill="#c7d2fe"/>
      </svg>
      <h1 class="text-white font-extrabold text-2xl tracking-wide">Sideboard Manager</h1>
      <p class="text-indigo-300 text-xs uppercase tracking-widest mt-1">Pauper</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <h2 class="text-gray-800 font-bold text-lg mb-6 text-center">Sign in</h2>

      <!-- Error banner -->
      <div id="error-banner" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-2.5">
        Invalid username or password.
      </div>

      <form method="POST" action="/api/auth/login" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Username</label>
          <input name="username" type="text" required autofocus
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-300"
            placeholder="your username" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Password</label>
          <input name="password" type="password" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-300"
            placeholder="••••••••" />
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg py-2.5 text-sm transition shadow-sm mt-2">
          Sign in
        </button>
      </form>
    </div>
  </div>

  <script>
    // Show error banner if ?error=1 is in the URL
    if (new URLSearchParams(location.search).get('error') === '1') {
      document.getElementById('error-banner').classList.remove('hidden');
    }
  </script>
</body>
</html>
